#
# NoDrive for Android: branding gate, debug-signed APK, unit tests and lint for the nodrive flavour.
# Only nodrive tasks are called (never assembleDebug/check/build, which would build all upstream flavours).
# No secrets are used. Upstream's own workflows are kept for reference in .github/upstream-workflows/.

name: Android

on:
    push:
        branches: [ main, platform/android ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

env:
    APK: app/build/outputs/apk/nodrive/debug/app-nodrive-debug.apk
    # Gradle caches are written only from our two long-lived branches.
    GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/platform/android' }}

jobs:
    branding:
        name: Branding gate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            -   name: Install Pillow (for make-icons --check)
                run: python -m pip install --disable-pip-version-check "Pillow==12.2.0"

            -   name: rebrand.py --check
                run: python tools/rebrand.py --check

            -   name: make-icons.py --check
                run: python tools/make-icons.py --check

            -   name: check-branding.py --source
                run: |
                    mkdir -p build/branding
                    python tools/check-branding.py --source --report build/branding/branding-report.md

            -   name: Upload branding report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-branding-report
                    path: build/branding/
                    if-no-files-found: warn
                    retention-days: 14

    build:
        name: APK and unit tests
        needs: branding
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    # MIT-licensed provider; the default "enhanced" provider needs Gradle's proprietary terms.
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            # AGP creates ~/.android/debug.keystore on first use. Keeping it lets the owner install a newer
            # APK over an older one (same debug signature). It is AGP's public debug key, not a secret.
            -   name: Restore debug keystore
                id: keystore
                uses: actions/cache/restore@v6
                with:
                    path: ~/.android/debug.keystore
                    key: nodrive-debug-keystore-v1

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            -   name: Assemble nodriveDebug (debug-signed APK)
                run: ./gradlew --stacktrace :app:assembleNodriveDebug

            -   name: Save debug keystore
                if: ${{ steps.keystore.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v6
                with:
                    path: ~/.android/debug.keystore
                    key: nodrive-debug-keystore-v1

            -   name: Check the APK (signature, manifest, ids, Nextcloud URLs)
                run: |
                    set -o pipefail
                    mkdir -p build/apk
                    cp "$APK" build/apk/
                    (cd build/apk && sha256sum app-nodrive-debug.apk > app-nodrive-debug.apk.sha256)
                    cat build/apk/app-nodrive-debug.apk.sha256
                    BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
                    "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/apk/app-nodrive-debug.apk \
                        > build/apk/signature.txt 2>&1
                    grep -v "^WARNING" build/apk/signature.txt
                    rc=0
                    python tools/check-apk.py build/apk/app-nodrive-debug.apk --aapt2 "$BUILD_TOOLS/aapt2" \
                        --dump-dir build/apk/aapt2-dumps --report build/apk/apk-check.md > /dev/null || rc=$?
                    cat build/apk/apk-check.md >> "$GITHUB_STEP_SUMMARY" || true
                    sed -n '/^## Result/,$p' build/apk/apk-check.md || true
                    exit "$rc"

            -   name: Upload APK
                if: ${{ always() && hashFiles('build/apk/app-nodrive-debug.apk') != '' }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-apk
                    path: build/apk/
                    if-no-files-found: error
                    retention-days: 14

            -   name: Unit tests (nodriveDebug)
                run: ./gradlew --stacktrace :app:testNodriveDebugUnitTest

            -   name: Upload unit test report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-unit-test-report
                    path: |
                        app/build/reports/tests/testNodriveDebugUnitTest/
                        app/build/test-results/testNodriveDebugUnitTest/
                    if-no-files-found: warn
                    retention-days: 14

    lint:
        name: Lint
        needs: branding
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            -   name: Lint nodriveDebug
                run: ./gradlew --stacktrace :app:lintNodriveDebug

            -   name: Upload lint report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-lint-report
                    path: |
                        app/build/reports/lint/
                        app/build/reports/lint-results-nodriveDebug.*
                    if-no-files-found: warn
                    retention-days: 14
