#
# NoDrive for Android: branding gate, debug-signed APK, unit tests, lint, and on an emulator the
# instrumented tests, a screenshot of every reachable screen and a network check, for the nodrive flavour.
# Only nodrive tasks are called (never assembleDebug/check/build, which would build all upstream flavours).
# No secrets are used. Upstream's own workflows are kept for reference in .github/upstream-workflows/.

name: Android

on:
    push:
        branches: [ main, platform/android, feature/workspace-apps, feature/backup-settings, feature/backup-settings-fixes, feature/smart-conflicts, feature/problem-reports, feature/noagenda-core, feature/noagenda-edit, feature/noagenda-timeline, feature/device-calendar-sync ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: android-${{ github.ref }}
    cancel-in-progress: true

env:
    APK: app/build/outputs/apk/nodrive/debug/app-nodrive-debug.apk
    # Gradle caches are written only from our two long-lived branches.
    GRADLE_CACHE_READ_ONLY: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/platform/android' }}

jobs:
    branding:
        name: Branding gate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            -   name: Install Pillow (for make-icons --check)
                run: python -m pip install --disable-pip-version-check "Pillow==12.2.0"

            -   name: rebrand.py --check
                run: python tools/rebrand.py --check

            -   name: make-icons.py --check
                run: python tools/make-icons.py --check

            -   name: check-branding.py --source
                run: |
                    mkdir -p build/branding
                    python tools/check-branding.py --source --report build/branding/branding-report.md

            # The gate must still fail on upstream's stock variant (what main shipped before the merge).
            -   name: check-branding.py --self-test
                run: python tools/check-branding.py --self-test

            -   name: Upload branding report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-branding-report
                    path: build/branding/
                    if-no-files-found: warn
                    retention-days: 14

    server-login:
        name: Server login proof
        needs: branding
        # Playwright supports Ubuntu 24.04, not yet the 26.04 that ubuntu-latest has become.
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            # A throwaway Nextcloud 35.0.2 in Docker with random credentials (masked); never drive.nourax.org.
            -   name: Start the throwaway server
                run: bash tools/ci/server-app-login.sh start

            -   name: Install Playwright (web view user agent check)
                run: |
                    python -m pip install --disable-pip-version-check "playwright==1.55.0"
                    python -m playwright install --with-deps chromium

            -   name: Check the app sign-in method against the server
                run: bash tools/ci/server-app-login.sh check

            -   name: Upload server login report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: server-login-report
                    path: |
                        build/server-login/*.md
                        build/server-login/*.json
                        build/server-login/*.png
                    if-no-files-found: warn
                    retention-days: 14

    build:
        name: APK and unit tests
        needs: branding
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    # MIT-licensed provider; the default "enhanced" provider needs Gradle's proprietary terms.
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            # AGP creates ~/.android/debug.keystore on first use. Keeping it lets the owner install a newer
            # APK over an older one (same debug signature). It is AGP's public debug key, not a secret.
            -   name: Restore debug keystore
                id: keystore
                uses: actions/cache/restore@v6
                with:
                    path: ~/.android/debug.keystore
                    key: nodrive-debug-keystore-v1

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            -   name: Assemble nodriveDebug (debug-signed APK)
                run: ./gradlew --stacktrace :app:assembleNodriveDebug

            -   name: Save debug keystore
                if: ${{ steps.keystore.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@v6
                with:
                    path: ~/.android/debug.keystore
                    key: nodrive-debug-keystore-v1

            # The GPL-2.0 text, NOTICE.md and the libraries' NOTICE texts travel with the APK (see NOTICE.md).
            -   name: Licence and notice files for the APK artifact
                run: |
                    set -o pipefail
                    mkdir -p build/apk
                    ./gradlew -q --no-configuration-cache :app:dependencies \
                        --configuration nodriveDebugRuntimeClasspath > build/apk/runtime-dependencies.txt
                    cp LICENSE.txt NOTICE.md build/apk/
                    BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
                    VERSION=$("$BUILD_TOOLS/aapt2" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
                    python tools/ci/third-party-notices.py --deps build/apk/runtime-dependencies.txt \
                        --out build/apk/THIRD-PARTY-NOTICES.txt --version "$VERSION" \
                        --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"

            -   name: Check the APK (signature, manifest, ids, Nextcloud URLs)
                run: |
                    set -o pipefail
                    mkdir -p build/apk
                    cp "$APK" build/apk/
                    (cd build/apk && sha256sum app-nodrive-debug.apk > app-nodrive-debug.apk.sha256)
                    cat build/apk/app-nodrive-debug.apk.sha256
                    BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
                    "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/apk/app-nodrive-debug.apk \
                        > build/apk/signature.txt 2>&1
                    grep -v "^WARNING" build/apk/signature.txt
                    rc=0
                    python tools/check-apk.py build/apk/app-nodrive-debug.apk --aapt2 "$BUILD_TOOLS/aapt2" \
                        --dump-dir build/apk/aapt2-dumps --report build/apk/apk-check.md > /dev/null || rc=$?
                    cat build/apk/apk-check.md >> "$GITHUB_STEP_SUMMARY" || true
                    sed -n '/^## Result/,$p' build/apk/apk-check.md || true
                    exit "$rc"

            -   name: Upload APK
                if: ${{ always() && hashFiles('build/apk/app-nodrive-debug.apk') != '' }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-apk
                    path: build/apk/
                    if-no-files-found: error
                    retention-days: 14

            -   name: Unit tests (nodriveDebug)
                run: ./gradlew --stacktrace :app:testNodriveDebugUnitTest

            -   name: Upload unit test report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-unit-test-report
                    path: |
                        app/build/reports/tests/testNodriveDebugUnitTest/
                        app/build/test-results/testNodriveDebugUnitTest/
                    if-no-files-found: warn
                    retention-days: 14

    lint:
        name: Lint
        needs: branding
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            -   name: Lint nodriveDebug
                run: ./gradlew --stacktrace :app:lintNodriveDebug

            -   name: Upload lint report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-lint-report
                    path: |
                        app/build/reports/lint/
                        app/build/reports/lint-results-nodriveDebug.*
                    if-no-files-found: warn
                    retention-days: 14

    agenda-server:
        name: NoAgenda API checks
        needs: branding
        # Playwright is not used here, but the other server jobs run on Ubuntu 24.04 too.
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            # A throwaway Nextcloud 35.0.2 with the pinned calendar, tasks, Deck and nc_gantt 2.4.1 apps, seeded with the data of the
            # NoAgenda design (section 12). Random credentials (masked); never drive.nourax.org; the server contacts no app store.
            -   name: Start and seed the throwaway server
                run: bash tools/ci/agenda-server.sh start

            # The auth proof, the API contract and the reads of four people (tests skip themselves without NODRIVE_AG_URL).
            -   name: NoAgenda API checks (auth proof, contract, reads)
                env:
                    NODRIVE_AG_REPORT_DIR: ${{ github.workspace }}/build/agenda-server
                run: ./gradlew --stacktrace :app:testNodriveDebugUnitTest --tests 'org.nourax.nodrive.agenda.server.*'

            -   name: No throwaway password in what is uploaded
                if: ${{ always() }}
                run: bash tools/ci/agenda-server.sh leakcheck build/agenda-server app/build/test-results app/build/reports/tests

            -   name: Report
                if: ${{ always() }}
                run: |
                    {
                        cat build/agenda-server/server-report.md 2> /dev/null || true
                        echo
                        echo "## API checks"
                        echo
                        echo "| Check | Result | Detail |"
                        echo "|---|---|---|"
                        cat build/agenda-server/report.md 2> /dev/null || true
                    } >> "$GITHUB_STEP_SUMMARY"

            -   name: Upload the report
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-agenda-server
                    path: |
                        build/agenda-server/
                        app/build/test-results/testNodriveDebugUnitTest/
                    if-no-files-found: warn
                    retention-days: 14

    agenda-device:
        name: NoAgenda on the emulator
        needs: branding
        runs-on: ubuntu-latest
        timeout-minutes: 150
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            -   name: Install Pillow (the brightness check of the screenshots)
                run: python -m pip install --disable-pip-version-check "Pillow==12.2.0"

            # Same debug key as the other jobs, so this APK installs over the published one.
            -   name: Restore debug keystore
                uses: actions/cache/restore@v6
                with:
                    path: ~/.android/debug.keystore
                    key: nodrive-debug-keystore-v1

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            -   name: Build the nodriveDebug APK and its test APK
                run: |
                    ./gradlew --stacktrace :app:assembleNodriveDebug :app:assembleNodriveDebugAndroidTest
                    sha256sum "$APK"

            # The throwaway server with the four apps and the seed. The emulator reaches it as 10.0.2.2:8080. Never drive.nourax.org.
            -   name: Start and seed the throwaway server
                run: |
                    bash tools/ci/agenda-server.sh start
                    echo "NODRIVE_AG_DEVICE_URL=http://10.0.2.2:8080" >> "$GITHUB_ENV"

            # A local DNS server answers "no such name" for every *.nourax.org name; the emulator uses it (-dns-server below).
            -   name: Local DNS that never resolves nourax.org names
                run: |
                    sudo apt-get install -y --no-install-recommends dnsmasq-base
                    sudo dnsmasq --conf-file=/dev/null --no-resolv --no-hosts --listen-address=127.0.0.2 --bind-interfaces                         --address=/nourax.org/ --server=127.0.0.53 --pid-file=/tmp/nodrive-dnsmasq.pid
                    sleep 1
                    python3 tools/ci/dns-check.py --server 127.0.0.2 --blocked drive.nourax.org --control github.com

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm

            -   name: NoAgenda tests on the emulator
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: 35
                    target: google_apis
                    arch: x86_64
                    profile: pixel_6
                    cores: 3
                    ram-size: 4096M
                    disk-size: 6000M
                    emulator-boot-timeout: 900
                    disable-animations: true
                    emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 127.0.0.2 -tcpdump ${{ github.workspace }}/build/device/network.pcap
                    pre-emulator-launch-script: mkdir -p build/device
                    script: bash tools/ci/agenda-device.sh

            -   name: Network check (never drive.nourax.org, no Nextcloud GmbH host)
                if: ${{ always() }}
                run: |
                    set -o pipefail
                    mkdir -p build/device
                    rc=0
                    python tools/check-network.py build/device/network.pcap --forbid-connection drive.nourax.org                         --report build/device/network-report.md > /dev/null || rc=$?
                    cat build/device/network-report.md >> "$GITHUB_STEP_SUMMARY" || true
                    sed -n '/^## Result/,$p' build/device/network-report.md || true
                    exit "$rc"

            -   name: No throwaway password in what is uploaded
                if: ${{ always() }}
                run: bash tools/ci/agenda-server.sh leakcheck build/device app/build/reports app/build/outputs/androidTest-results build/agenda-server

            -   name: Upload screenshots
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-agenda-screens
                    path: build/device/screens/agenda/
                    if-no-files-found: warn
                    retention-days: 14

            -   name: Upload logs
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-agenda-device-logs
                    path: |
                        build/device/agenda-*.log
                        build/device/network-report.md
                        build/agenda-server/server-report.md
                    if-no-files-found: warn
                    retention-days: 14

    device:
        name: Emulator tests and screenshots
        needs: branding
        runs-on: ubuntu-latest
        timeout-minutes: 150
        steps:
            -   uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: "21"

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v6
                with:
                    cache-provider: basic
                    cache-read-only: ${{ env.GRADLE_CACHE_READ_ONLY }}

            -   uses: actions/setup-python@v7
                with:
                    python-version: "3.12"

            -   name: Install Pillow (contact sheets and the colour check)
                run: python -m pip install --disable-pip-version-check "Pillow==12.2.0"

            # Same debug key as the "APK and unit tests" job, so this APK equals the published one.
            -   name: Restore debug keystore
                uses: actions/cache/restore@v6
                with:
                    path: ~/.android/debug.keystore
                    key: nodrive-debug-keystore-v1

            -   name: Gradle settings for CI
                run: |
                    mkdir -p ~/.gradle
                    echo "org.gradle.jvmargs=-Xmx6g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

            -   name: Build the nodriveDebug APK and its test APK
                run: |
                    ./gradlew --stacktrace :app:assembleNodriveDebug :app:assembleNodriveDebugAndroidTest
                    sha256sum "$APK"

            # A throwaway Nextcloud 35.0.2 with random credentials (masked) for tools/ci/workspace-device.sh and tools/ci/backup-device.sh, and a
            # probe server on port 8081 that plays "another host" (the emulator reaches it as localhost:8081 through adb reverse, a different host from 10.0.2.2:8080).
            -   name: Start the throwaway servers (Nextcloud on 8080, probe on 8081)
                run: |
                    bash tools/ci/server-app-login.sh start
                    mkdir -p build/device
                    nohup python3 tools/ci/probe-server.py --port 8081 --log build/device/probe.jsonl > /dev/null 2>&1 &
                    echo "NODRIVE_WS_URL=http://10.0.2.2:8080" >> "$GITHUB_ENV"

            # Rule of the build: CI never contacts drive.nourax.org. A local DNS server answers "no such name" for every
            # *.nourax.org name and forwards all other names. The emulator uses it (-dns-server below), so the app's
            # sign-in cannot reach the real server; tools/check-network.py fails the job on any connection to it.
            -   name: Local DNS that never resolves nourax.org names
                run: |
                    sudo apt-get install -y --no-install-recommends dnsmasq-base
                    sudo dnsmasq --conf-file=/dev/null --no-resolv --no-hosts --listen-address=127.0.0.2 --bind-interfaces \
                        --address=/nourax.org/ --server=127.0.0.53 --pid-file=/tmp/nodrive-dnsmasq.pid
                    sleep 1
                    python3 tools/ci/dns-check.py --server 127.0.0.2 --blocked drive.nourax.org --control github.com

            -   name: Enable KVM
                run: |
                    echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                    sudo udevadm control --reload-rules
                    sudo udevadm trigger --name-match=kvm

            # -tcpdump records every frame of the emulator's virtual LAN for tools/check-network.py.
            -   name: Instrumented tests and screen sweep on the emulator
                uses: reactivecircus/android-emulator-runner@v2
                with:
                    api-level: 35
                    target: google_apis
                    arch: x86_64
                    profile: pixel_6
                    cores: 3
                    ram-size: 4096M
                    disk-size: 6000M
                    emulator-boot-timeout: 900
                    disable-animations: true
                    emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -dns-server 127.0.0.2 -tcpdump ${{ github.workspace }}/build/device/network.pcap
                    pre-emulator-launch-script: mkdir -p build/device
                    script: NODRIVE_SIGNIN_OFFLINE=1 bash tools/ci/device.sh

            -   name: Workspace apps checks (server log, probe server, no credential in the reports)
                if: ${{ always() }}
                run: |
                    docker logs nodrive-ci-server 2>&1 | grep -E '"(GET|POST|PROPFIND) ' | cut -c1-200 | tail -n 300 \
                        > build/device/server-access-tail.log || true
                    rc=0
                    python3 tools/ci/probe-server.py --check build/device/probe.jsonl --min-requests 1 > build/device/probe-check.txt || rc=1
                    cat build/device/probe-check.txt
                    for name in NODRIVE_WS_SSO_TOKEN NODRIVE_WS_REMOVE_TOKEN NODRIVE_WS_PW_TOKEN NODRIVE_BK_TOKEN NODRIVE_CF_TOKEN NODRIVE_RP_TOKEN NODRIVE_WS_LOGIN_PASSWORD; do
                        value="${!name:-}"
                        [ -n "$value" ] || continue
                        if grep -rlaF --exclude=network.pcap -e "$value" build/device app/build/reports \
                            app/build/outputs/androidTest-results 2> /dev/null | grep -q .; then
                            echo "LEAK: the value of $name is in a file that gets uploaded"; rc=1
                        fi
                    done
                    exit "$rc"

            -   name: Network check (no Nextcloud GmbH host)
                if: ${{ always() }}
                run: |
                    set -o pipefail
                    mkdir -p build/device
                    rc=0
                    python tools/check-network.py build/device/network.pcap --require-host drive.nourax.org \
                        --forbid-connection drive.nourax.org \
                        --report build/device/network-report.md > /dev/null || rc=$?
                    cat build/device/network-report.md >> "$GITHUB_STEP_SUMMARY" || true
                    sed -n '/^## Result/,$p' build/device/network-report.md || true
                    exit "$rc"

            -   name: Sweep summary
                if: ${{ always() }}
                run: |
                    if [ -f build/device/screens/index.md ]; then
                        sed -n '1,/^## Screens/p' build/device/screens/index.md >> "$GITHUB_STEP_SUMMARY"
                        sed -n '/^## Result/,$p' build/device/screens/index.md
                    fi

            -   name: Upload screenshots
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-screenshots
                    path: build/device/screens/
                    if-no-files-found: warn
                    retention-days: 14

            -   name: Upload instrumented test reports and device logs
                if: ${{ always() }}
                uses: actions/upload-artifact@v7
                with:
                    name: nodrive-android-instrumented-test-report
                    path: |
                        app/build/reports/androidTests/connected/
                        app/build/outputs/androidTest-results/connected/
                        build/device/*.log
                        build/device/*.txt
                        build/device/*.md
                        build/device/first-run/
                        build/device/network.pcap
                    if-no-files-found: warn
                    retention-days: 14
